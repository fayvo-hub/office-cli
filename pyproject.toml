[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-cli"
version = "0.3.0"
description = "面向 AI 调用的办公文档 CLI:Excel/Word/PDF/Markdown/PowerPoint 读写与互转(JSON 输入输出)"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "pdfplumber>=0.11",
    "pypdf>=4.0",
    "pdf2docx>=0.5",
    "python-pptx>=1.0",
]

[project.optional-dependencies]
images = ["Pillow>=10.0"]
mdpdf = ["markdown>=3.5", "pygments>=2.17", "playwright>=1.40"]
wps = ["pywin32>=306"]

[project.scripts]
office = "office.cli:main"

[tool.setuptools.packages.find]
include = ["office*"]
